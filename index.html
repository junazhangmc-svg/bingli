<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FCFDFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="病历本">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>病历本</title>
<style>
/* ==========================================================================
 * 配色与排版。两个 data-theme 值都声明同一套 —— 这是刻意的：
 * 化验单的颜色在屏幕和纸上必须一致，深色模式会毁掉黑白打印的可读性。
 * ========================================================================== */
:root,
:root[data-theme="light"],
:root[data-theme="dark"]{
  --paper:#FCFDFB; --card:#FFFFFF;
  --ink:#141A17; --ink-soft:#4F574F; --ink-faint:#7C847D;
  --rule:#E2E6E0; --rule-soft:#F0F2EE;
  --accent:#2C6152; --accent-bg:#EAF3EF;
  --good:#256B3F; --good-bg:#E4F1E8;
  --warn:#8A5D10; --warn-bg:#FAF0D9;
  --bad:#A33528;  --bad-bg:#FBE6E1;
  color-scheme:light;
}
:root{
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Source Han Sans SC","Noto Sans SC",
         "Hiragino Sans GB","Microsoft YaHei","Droid Sans Fallback",system-ui,sans-serif;
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.65;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:640px; margin:0 auto; padding:0 14px 120px}

/* ---- 顶栏 ---- */
.bar{
  position:sticky; top:0; z-index:20; background:var(--paper);
  padding:calc(10px + env(safe-area-inset-top)) 0 0;
  border-bottom:1px solid var(--rule-soft);
}
.bar h1{font-family:var(--serif); font-size:20px; margin:0 0 9px; letter-spacing:1px}
.tabs{display:flex; gap:3px}
.tabs button{
  flex:1; min-height:44px; padding:9px 4px; font-size:14.5px; font-family:inherit;
  border:none; background:none; color:var(--ink-faint); cursor:pointer;
  border-bottom:2.5px solid transparent; font-weight:500;
}
.tabs button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}

h2.sec{font-family:var(--serif); font-size:17px; margin:24px 0 10px; letter-spacing:.6px}
h2.sec:first-child{margin-top:18px}
.lede{color:var(--ink-soft); font-size:14.5px; margin:0 0 8px}
.tiny-note{color:var(--ink-faint); font-size:13px; line-height:1.55}

/* ---- 卡片与状态三色 ---- */
.card{
  background:var(--card); border:1px solid var(--rule); border-radius:10px;
  padding:15px 16px; margin:10px 0;
}
.card.tight{padding:12px 15px}
.card.flag-good{border-left:5px solid var(--good)}
.card.flag-warn{border-left:5px solid var(--warn)}
.card.flag-bad{border-left:5px solid var(--bad)}
.card h3{font-size:16px; margin:0 0 4px; font-weight:600}

.pill{
  display:inline-block; font-size:12px; padding:2px 9px; border-radius:20px;
  font-weight:600; white-space:nowrap; vertical-align:middle;
}
.p-good{background:var(--good-bg); color:var(--good)}
.p-warn{background:var(--warn-bg); color:var(--warn)}
.p-bad{background:var(--bad-bg);  color:var(--bad)}
.p-idle{background:var(--rule-soft); color:var(--ink-faint)}
.p-accent{background:var(--accent-bg); color:var(--accent)}

.summary{border:1px solid var(--rule); border-radius:9px; padding:11px 13px; margin-top:10px}
.s-good{background:var(--good-bg); border-color:transparent}
.s-warn{background:var(--warn-bg); border-color:transparent}
.s-bad{background:var(--bad-bg);  border-color:transparent}

/* ---- 首页摘要条 ---- */
.latest{
  display:block; width:100%; text-align:left; border:1px solid var(--rule);
  border-radius:10px; padding:14px 16px; font-family:inherit; font-size:16px;
  color:var(--ink); cursor:pointer; background:var(--card); margin:10px 0;
}
.l-good{background:var(--good-bg); border-color:transparent}
.l-warn{background:var(--warn-bg); border-color:transparent}
.l-bad{background:var(--bad-bg);  border-color:transparent}
.latest .l-date{font-size:13px; color:var(--ink-soft); font-family:var(--mono)}
.latest .l-main{font-weight:600; margin:3px 0}
.latest .l-more{font-size:13.5px; color:var(--accent); font-weight:600}

/* ---- 折叠 ---- */
details.fold{border-top:1px solid var(--rule-soft); margin-top:11px}
details.fold>summary{
  list-style:none; cursor:pointer; position:relative;
  padding:11px 28px 11px 2px;              /* 上下 padding 保证触摸区 ≥44px */
  font-size:14px; color:var(--accent); font-weight:600;
}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{
  content:""; position:absolute; right:8px; top:16px; width:7px; height:7px;
  border-right:2px solid var(--accent); border-bottom:2px solid var(--accent);
  transform:rotate(45deg); transition:transform .18s;
}
details.fold[open]>summary::after{transform:rotate(-135deg); top:19px}
@media (prefers-reduced-motion:reduce){ details.fold>summary::after{transition:none} }

/* ---- 表单 ---- */
label{display:block; font-size:13.5px; color:var(--ink-soft); margin:12px 0 4px}
input,select,textarea{
  width:100%; font-family:var(--sans);
  font-size:16px;                          /* 低于 16px 时 iOS 聚焦会缩放页面 */
  padding:10px 11px; min-height:46px;
  border:1px solid var(--rule); border-radius:8px;
  background:var(--card); color:var(--ink); -webkit-appearance:none;
}
input[inputmode="decimal"]{font-family:var(--mono); font-variant-numeric:tabular-nums}
textarea{min-height:84px; line-height:1.6; resize:vertical}
input:focus,select:focus,textarea:focus{
  outline:2px solid var(--accent); outline-offset:1px;
  box-shadow:0 0 0 3px var(--accent-bg);
}
select{background-image:none}

/* 指标行：名字和目标叠在左边一列，输入框占右边整格 */
.field{
  display:grid; grid-template-columns:1fr 132px; gap:2px 10px;
  align-items:center; padding:9px 0; border-bottom:1px solid var(--rule-soft);
}
.field:last-child{border-bottom:none}
.field .f-n{font-size:15.5px; grid-column:1; grid-row:1}
.field .f-t{font-size:12.5px; color:var(--ink-faint); grid-column:1; grid-row:2; font-family:var(--mono)}
.field input,.field select{grid-column:2; grid-row:1 / span 2; min-height:44px}
.field .f-w{grid-column:1 / -1; font-size:12.5px; color:var(--ink-faint); margin-top:4px}

/* ---- 按钮 ---- */
.btn{
  font-family:inherit; font-size:16px; font-weight:600; min-height:50px;
  padding:13px 18px; border-radius:9px; cursor:pointer;
  border:1px solid var(--accent); background:var(--card); color:var(--accent);
}
.btn.solid{background:var(--accent); color:#fff}
.btn.danger{border-color:var(--bad); color:var(--bad)}
.btn.tiny{font-size:13.5px; min-height:40px; padding:8px 13px; font-weight:500}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.row .btn{flex:1 1 auto}

/* ---- 分类切换 ---- */
.picker{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 4px}
.picker button{
  min-height:40px; padding:7px 13px; font-size:14px; font-family:inherit;
  border:1px solid var(--rule); border-radius:20px;
  background:var(--card); color:var(--ink-soft); cursor:pointer;
}
.picker button[aria-pressed="true"]{
  background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:600;
}

/* ---- 复选（疾病标签） ---- */
.checks{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px}
.checks label{
  display:inline-flex; align-items:center; gap:6px; margin:0;
  min-height:40px; padding:6px 12px; font-size:14px; color:var(--ink);
  border:1px solid var(--rule); border-radius:20px; cursor:pointer; background:var(--card);
}
.checks label.on{background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:600}
.checks input{width:auto; min-height:0; margin:0; -webkit-appearance:checkbox; appearance:checkbox}
.sug{font-size:12.5px; color:var(--ink-faint); margin-top:6px}

/* ---- 值行（历史页判读） ---- */
.v-row{
  display:grid; grid-template-columns:1fr auto; gap:2px 10px;
  padding:8px 0; border-bottom:1px solid var(--rule-soft); align-items:baseline;
}
.v-row:last-child{border-bottom:none}
.v-n{font-size:15px}
.v-v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:15.5px; text-align:right}
.v-t{font-size:12.5px; color:var(--ink-faint); font-family:var(--mono)}
.v-note{grid-column:1 / -1; font-size:12.5px; color:var(--ink-faint); margin-top:2px}
.v-trend{font-size:12.5px; color:var(--ink-soft); font-family:var(--mono); margin-left:6px}
.grp-title{font-family:var(--serif); font-size:14.5px; color:var(--accent);
           margin:14px 0 2px; letter-spacing:.5px}

/* ---- 历史记录条目 ---- */
details.hrec{
  background:var(--card); border:1px solid var(--rule); border-radius:10px;
  margin:9px 0; overflow:hidden;
}
details.hrec>summary{list-style:none; cursor:pointer; padding:13px 15px; position:relative}
details.hrec>summary::-webkit-details-marker{display:none}
details.hrec>summary::after{
  content:""; position:absolute; right:15px; top:19px; width:7px; height:7px;
  border-right:2px solid var(--ink-faint); border-bottom:2px solid var(--ink-faint);
  transform:rotate(45deg); transition:transform .18s;
}
details.hrec[open]>summary::after{transform:rotate(-135deg); top:22px}
.h-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-right:22px}
.h-date{font-family:var(--mono); font-size:14px; color:var(--ink-soft)}
.h-title{font-weight:600; font-size:15.5px}
.h-meta{font-size:12.5px; color:var(--ink-faint); margin-top:3px}
.h-prev{
  font-size:13px; color:var(--ink-faint); margin-top:5px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
details.hrec[open] .h-prev{display:none}
.h-body{padding:0 15px 15px; border-top:1px solid var(--rule-soft)}
.h-tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px}

/* ---- 空状态 ---- */
.empty{text-align:center; padding:44px 20px; color:var(--ink-faint)}
.empty p{margin:6px 0}

/* ---- 底部动作条 ---- */
.fab{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--paper) 62%, transparent);
}
.fab .inner{max-width:640px; margin:0 auto}
.fab .btn{width:100%}

/* ---- 提示条 ---- */
.toast{
  position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(140%); z-index:40;
  background:var(--ink); color:var(--paper); font-size:14.5px;
  padding:11px 18px; border-radius:22px; max-width:90vw; text-align:center;
  transition:transform .22s;
  /* 光靠位移移出屏幕不够：空的提示条仍会被读屏软件读到，
     整页截图和打印时也可能被画出来。 */
  visibility:hidden;
}
.toast.show{transform:translateX(-50%) translateY(0); visibility:visible}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }

/* ---- AI 输出 ---- */
.ai-res{margin-top:12px}
.ai-res h4{font-family:var(--serif); font-size:15px; color:var(--accent); margin:14px 0 4px}
.ai-res p{margin:6px 0; font-size:15px}
.ai-res ul{margin:6px 0; padding-left:20px}
.ai-res li{margin:3px 0; font-size:15px}
.ai-meta{font-size:12px; color:var(--ink-faint); margin-top:10px; font-family:var(--mono)}

/* ---- 打印 ----
 * .p-abn 必须在屏幕上也生效：预览页就是用来「打印前先看一眼」的，
 * 只定义在 @media print 里的话，屏幕上超标反而比偏离还淡
 * （偏离有 600 字重，超标什么都没有），预览就骗人了。 */
.p-abn{font-weight:700; text-decoration:underline; text-underline-offset:2px}
#print-root{display:none}
@page{ size:A4; margin:14mm 12mm; }
@media print{
  /* 变量整体换成纸面配色，比逐条覆盖规则可靠 */
  :root,:root[data-theme="light"],:root[data-theme="dark"]{
    --paper:#fff; --card:#fff;
    --ink:#000; --ink-soft:#333; --ink-faint:#555;
    --rule:#999; --rule-soft:#ccc; --accent:#000;
    --good:#000; --warn:#000; --bad:#000;
    --good-bg:#fff; --warn-bg:#fff; --bad-bg:#fff; --accent-bg:#fff;
  }
  body{font-size:10.5pt; line-height:1.45}
  .bar,.tabs,.fab,.toast,.no-print,#views{display:none !important}
  #print-root{display:block !important}
  .app{max-width:none; padding:0}
  .p-block,.p-visit,tr,table,.card{break-inside:avoid; page-break-inside:avoid}
  thead{display:table-header-group}          /* 日期表头要在第二页重复出现 */
  h2,h3{break-after:avoid}
  a[href]::after{content:""}
  /* 屏幕上靠颜色区分的异常，在黑白纸上必须靠箭头和字重 */
  .p-abn{font-weight:700; text-decoration:underline}
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <h1>病历本</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" id="t-home" aria-selected="true"  onclick="go('home')">首页</button>
      <button role="tab" id="t-hist" aria-selected="false" onclick="go('hist')">记录</button>
      <button role="tab" id="t-meds" aria-selected="false" onclick="go('meds')">用药</button>
      <button role="tab" id="t-more" aria-selected="false" onclick="go('more')">更多</button>
    </nav>
  </header>

  <main id="views">
    <div class="view" id="v-home"></div>
    <div class="view" id="v-hist"  hidden></div>
    <div class="view" id="v-meds"  hidden></div>
    <div class="view" id="v-more"  hidden></div>
    <div class="view" id="v-entry" hidden></div>
    <div class="view" id="v-print" hidden></div>
  </main>

  <div id="print-root"></div>
</div>

<div class="fab" id="fab" hidden><div class="inner"><button class="btn solid" id="fab-btn"></button></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="store.js"></script>
<script src="ai.js"></script>
<script src="vision.js"></script>
<script src="print.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
